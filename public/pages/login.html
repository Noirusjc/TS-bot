<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — TS3 Bot Panel</title>
<link rel="stylesheet" href="/css/style.css"/>
<style>
  body { display: block; }
</style>
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-card">
      <div class="login-logo">
        <div class="icon">🤖</div>
        <h1>TS3 Bot Panel</h1>
        <p>TeamSpeak 3 Management System</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input id="username" class="form-control" type="text" placeholder="admin" autocomplete="username" required/>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input id="password" class="form-control" type="password" placeholder="••••••••" autocomplete="current-password" required/>
        </div>
        <button id="btn-login" type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">
          Sign In
        </button>
      </form>

      <p style="text-align:center;margin-top:20px;font-size:0.78rem;color:var(--text-muted);">
        TS3 Management Bot v1.0
      </p>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-login');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) return;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in...';

    try {
      await API.login(username, password);
      window.location.href = '/dashboard';
    } catch (err) {
      showAlert('alert', err.message || 'Login failed', 'danger');
      btn.disabled = false;
      btn.innerHTML = 'Sign In';
    }
  });

  function showAlert(id, message, type) {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = 'alert alert-' + type + ' show';
    el.textContent = message;
  }
</script>
</body>
</html>
